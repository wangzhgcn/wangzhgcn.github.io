<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/images/mito.png' | relative_url }}">

<style>
/* 当前页面的导航标签 */
{% for link in site.data.navigation.main %}
  {% if link.url == page.url %}
    .masthead__menu-item a[href="{{ link.url | relative_url }}"] {
      background-color: #e3eeea;
      color: #174f45;
      border-radius: 5px;
      font-weight: 600;
    }
  {% endif %}
{% endfor %}
/* 导航栏标签间距 */
.masthead__menu-item a {
  padding: 10px 14px;
}
</style>
